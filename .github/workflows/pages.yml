name: Pubblica dashboard su GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "scripts/06_build_static_site.py"
      - "data/processed/dashboard_data.csv"
      - "data/processed/people_registry_used.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v6
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Genera dashboard statica
        run: python scripts/06_build_static_site.py --allow-empty
      - name: Carica artifact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
