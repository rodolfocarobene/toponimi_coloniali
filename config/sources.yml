wikipedia:
  language: it
  search_queries:
    - "\"governatore\" Eritrea italiana"
    - "\"governatore\" Libia italiana"
    - "\"governatore\" Cirenaica italiana"
    - "\"governatore\" Tripolitania italiana"
    - "\"viceré\" Etiopia italiano"
    - "\"guerra d'Etiopia\" generale italiano"
    - "\"guerra italo-turca\" generale italiano"
    - "\"ministro delle colonie\" Italia"
  categories:
    - "Governatori dell'Eritrea"
    - "Governatori della Libia italiana"
    - "Governatori dell'Africa Orientale Italiana"
    - "Militari italiani della guerra italo-turca"
    - "Militari italiani della guerra d'Etiopia"

anncsu:
  landing_page: "https://www.anncsu.gov.it/it/consultazione-dellarchivio/open-data/Accedi-ai-servizi-di-dowload-massivo-in-Open-data/"
  istat_municipalities_xlsx: "https://www.istat.it/storage/codici-unita-amministrative/Elenco-comuni-italiani.xlsx"

matching:
  fuzzy_threshold: 93
  surname_only_threshold: 100
  auto_accept_exact_full_name: true
  auto_accept_exact_alias: true
  require_manual_review_for_surname_only: true
  require_manual_review_for_fuzzy: true

# Luoghi pubblici intitolati (scuole, universita, altri luoghi): scaricati da scripts/02b_download_public_places.py
# in data/raw/public_places/. Date di accesso: 2026-10-23. L'elenco dei file effettivamente scaricati
# (URL, data, dimensione) e' in data/raw/public_places/manifest.json.
public_places:
  mim_catalog_page: "https://dati.istruzione.it/opendata/opendata/catalogo/elements1/?area=Scuole"
  mim_catalog_base: "https://dati.istruzione.it/opendata/opendata/catalogo/elements1"
  # Anagrafe scuole statali (SCUANAGRAFESTAT<aaaa><aa><data>.csv) e paritarie (SCUANAGRAFEPAR...), MIM,
  # ultimo anno scolastico in catalogo (2026/27, file ...20262720260901.csv; ~13 MB + ~2.5 MB).
  # Licenza: Italian Open Data License v2.0. Nessuna coordinata: si usa il centroide del comune.
  # Le province autonome di Trento e Bolzano e la Valle d'Aosta non sono nel dataset MIM; si usano:
  #  - Trento: "Istituzioni scolastiche del Trentino", dati.trentino.it (PAT, licenza CC0), XML con
  #    istituzioni e unita' didattiche (plessi). ATTENZIONE: istantanea del 2014-09-10 (l'ultima
  #    pubblicata); nomi e comuni possono essere cambiati (fusioni di comuni).
  #  - Bolzano e Valle d'Aosta: nessun elenco open data trovato (data.civis.bz.it / Open Data Hub e
  #    portali regionali VdA non pubblicano un registro delle scuole; dati.regione.vda.it non esiste,
  #    scuole.vda.it non raggiungibile). Ripiego: elementi Wikidata (CC0) "scuola" collocati in un
  #    comune di BZ (ISTAT 021*) o VdA (007*), importati in blocco dagli elenchi ufficiali: copertura
  #    e nomi non verificati (denominatori approssimati). Accesso 2026-10-25.
  trento_schools_xml: "https://dati.trentino.it/dataset/18034fef-88e5-4d4d-906d-5fdc381303cc/resource/1a04a591-14d7-49c9-a011-d54bc427fa0f/download/exportesco10092014.xml"
  mur_ckan_api: "https://dati-ustat.mur.gov.it/api/3/action"
  # MUR / Ufficio di Statistica: "<anno> Contribuzione e interventi atenei" (risorsa "Strutture atenei":
  # elenco dei nomi degli atenei) e "<anno> Collegi universitari" (risorsa "Alloggi per comune").
  # Ultimo anno disponibile: 2025. Licenza: Italian Open Data License v2.0.
  wikidata_sparql: "https://query.wikidata.org/sparql"
  # Wikidata (CC0): centroidi dei comuni (P625, codice ISTAT P635) e oggetti in Italia con P138
  # "intitolato a" una persona del registro (ricerca per etichetta esatta nome e cognome).
  overpass_endpoint: "https://overpass-api.de/api/interpreter"
  # OpenStreetMap (ODbL) via Overpass, per regione: biblioteche, municipi, ospedali, teatri, caserme,
  # stadi, parchi, musei, aeroporti, universita il cui nome contiene un nome del registro, piu i
  # conteggi totali per regione (denominatore). Fonte meno stabile di MIM/MUR: nomi non ufficiali.

# Orientamento politico delle amministrazioni: scaricato da scripts/07_download_politics.py in
# data/raw/politics/ (manifest.json con URL, data di accesso e dimensione). Date di accesso: 2026-10-25.
politics:
  interno_page: "https://dait.interno.gov.it/elezioni/open-data/amministratori-locali-e-regionali-in-carica"
  # Ministero dell'Interno, Anagrafe degli amministratori locali e regionali, "in carica al 24/08/2026".
  # Licenza non dichiarata sulla pagina. Colonne usate: descrizione_carica, data_elezione,
  # lista_appartenenza/collegamento (tutte le liste che sostengono il sindaco o il presidente).
  mayors_csv: "https://dait.interno.gov.it/documenti/maggiororgano.csv"   # ~2 MB, sindaci e commissari
  regional_csv: "https://dait.interno.gov.it/documenti/ammreg.csv"        # ~0,2 MB, consiglieri/presidenti
  party_families: "config/party_families.yml"
  # Campania e Marche mancano tra i presidenti del file regionale: aggiunti a mano in party_families.yml
  # (region_additions) con fonte Wikipedia.

# Quartieri (site_kind "quartiere"): scaricati da scripts/02c_download_quartieri.py in data/raw/quartieri/
# (manifest.json con URL, data di accesso e dimensione).
quartieri:
  overpass_endpoint: "https://overpass-api.de/api/interpreter"
  # OpenStreetMap (ODbL) via Overpass, per regione: place=quarter|neighbourhood|suburb e confini
  # amministrativi di livello 9 e 10 con nome (solo centro e tag). Il comune e' il piu' vicino per centroide
  # nella regione (approssimato). Denominatore total_kind_region: quartieri con nome distinti per regione.
  # Altre fonti di aree con nome, scaricate da 02c in data/raw/quartieri/ (stesso manifest.json):
  # - ISTAT, basi territoriali 2021, localita' puntuali (centri, nuclei abitati, localita' produttive, ~61 mila
  #   nomi): una riga per localita' con coordinate UTM 32N, comune da codice PRO_COM. Dati ISTAT riusabili con
  #   citazione della fonte (licenza CC BY 4.0, https://www.istat.it/note-legali/).
  # - elenchi ufficiali dei comuni (dati aperti CC BY): Milano (NIL vigenti PGT 2030 e obsoleti PGT 2012),
  #   Bologna (quartieri, zone, aree statistiche, zone di prossimita'), Torino (zone statistiche).
  istat_localita:
    url: "https://www.istat.it/storage/cartografia/basi_territoriali/2021/LocalitaPuntuali_21.zip"
    file: "istat/LocalitaPuntuali_21.zip"
    pause_seconds: 5
  city_lists:
    - file: "citta/milano_nil.geojson"
      url: "https://dati.comune.milano.it/dataset/e8e765fc-d882-40b8-95d8-16ff3d39eb7c/resource/9c4e0776-56fc-4f3d-8a90-f4992a3be426/download/ds964_nil_wm.geojson"
      source: "Comune di Milano, dataset ds964 NIL vigenti PGT 2030 (CC BY)"
    - file: "citta/milano_nil_obsoleti_pgt2012.geojson"
      url: "https://dati.comune.milano.it/dataset/e5a0d956-2eff-454d-b0ea-659cb7b55c0b/resource/af78bd3f-ea45-403a-8882-91cca05087f0/download/nilzone.geojson"
      source: "Comune di Milano, dataset ds61 NIL obsoleti PGT 2012 (CC BY)"
    - file: "citta/bologna_quartieri-di-bologna.json"
      url: "https://opendata.comune.bologna.it/api/explore/v2.1/catalog/datasets/quartieri-di-bologna/exports/json?limit=-1"
      source: "Comune di Bologna, Quartieri di Bologna (CC BY 4.0)"
    - file: "citta/bologna_zone-del-comune-di-bologna.json"
      url: "https://opendata.comune.bologna.it/api/explore/v2.1/catalog/datasets/zone-del-comune-di-bologna/exports/json?limit=-1"
      source: "Comune di Bologna, Zone del Comune di Bologna (CC BY 4.0)"
    - file: "citta/bologna_aree-statistiche.json"
      url: "https://opendata.comune.bologna.it/api/explore/v2.1/catalog/datasets/aree-statistiche/exports/json?limit=-1"
      source: "Comune di Bologna, Aree statistiche di Bologna (CC BY 4.0)"
    - file: "citta/bologna_zone_urbanistiche.json"
      url: "https://opendata.comune.bologna.it/api/explore/v2.1/catalog/datasets/zone_urbanistiche/exports/json?limit=-1"
      source: "Comune di Bologna, Zone di prossimita' (CC BY 4.0)"
    - file: "citta/torino_zone_statistiche_csv.zip"
      url: "http://geoportale.comune.torino.it/geodati/zip/zone_statistiche_csv.zip"
      source: "Citta' di Torino, Zone statistiche (CC BY)"
  themed_districts: "config/quartieri_tematici.yml"
  # Cluster rilevati dagli odonimi geocodificati: almeno min_streets vie distinte (match accettati) entro radius_m.
  cluster:
    min_streets: 5
    radius_m: 600
    name_max_distance_m: 1000
